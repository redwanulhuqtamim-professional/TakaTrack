services:
  db:
    image: postgres:16-alpine
    container_name: takatrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: takatrack_user
      POSTGRES_PASSWORD: takatrack_dev_password
      POSTGRES_DB: takatrack
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
